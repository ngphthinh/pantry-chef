spring.application.name=pantry-chef
spring.config.import=optional:file:.env[.properties]
server.servlet.context-path=/api

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# DATABASE
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?TimeZone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret-key=${JWT_SECRET}
# seconds
jwt.expiration=${JWT_EXPIRATION}
jwt.refreshable-duration=${JWT_REFRESH_EXPIRATION}
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED}
spring.data.redis.password=${REDIS_PASSWORD}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.avatar.folder=avatars
app.password-default=${APP_PASSWORD_DEFAULT}

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.chat.thinking-budget=0

app.upload.max-size=5242880
app.upload.allowed-types=image/jpeg,image/png,image/webp
app.ai.min-confidence=0.5
app.ai.substitution.max-results=5
app.ai.prompt.path.recognize-ingredients=prompts/recognize-ingredients.st
app.ai.prompt.path.substitutions=prompts/substitutions.st
app.ai.prompt.path.meal-plan=prompts/meal-plan.st
app.ai.meal-plan.max-pantry-items=50
app.ai.blocked-terms=thuoc,benh,dieu tri,lieu dung,chua benh,tieu duong,huyet ap,ung thu,medicine,dosage,treatment,diagnos,prescription,cure

# RECIPE (Spoonacular)
app.recipe.provider.base-url=${SPOONACULAR_BASE_URL}
app.recipe.provider.api-key=${SPOONACULAR_API_KEY}
app.recipe.provider.connect-timeout-ms=3000
app.recipe.provider.read-timeout-ms=8000
app.recipe.cache.ttl-minutes=60

app.ai.prompt.path.recipe-ideas=prompts/recipe-ideas.st
app.ai.prompt.path.adapt-recipe=prompts/adapt-recipe.st
app.ai.recipe-ideas.max-results=5