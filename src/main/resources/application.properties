spring.application.name=pantry-chef
server.servlet.context-path=/api
# DATABASE CONNECTION CONFIGURATION
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pantry-chef}?TimeZone=UTC
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:sapassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# JPA / HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=OFF
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.org.hibernate.orm.jdbc.bind=TRACE

jwt.secret-key=${JWT_SECRET:o035x6aSm1lfK0iqFP+/aLFqAsRm1gcv8Lr7VtXl+J8mR7q3D+x51xbYeSzuE8B9gP5vMJzfVTmaB7FtLbZ9jg==}

# seconds
jwt.expiration=${JWT_EXPIRATION:3600}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800}
jwt.refreshable-duration=${JWT_REFRESHABLE_DURATION:1209600}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.password=${REDIS_PASSWORD}
logging.level.org.springframework.security=DEBUG


cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.avatar.folder=avatars
app.password-default=User@123